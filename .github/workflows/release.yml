name: Release add-on

on:
  workflow_dispatch:
    inputs:
      addon:
        description: Add-on to release
        required: true
        type: choice
        options:
          - bumblebee
          - super-pickaxe

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ inputs.addon }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # Bumps this add-on's patch version, syncs its manifests and writes dist/<addon>-v<version>.mcaddon.
      - name: Package
        run: npm run package -- "${{ inputs.addon }}"

      - name: Resolve release file
        id: build
        run: |
          file=$(ls dist/"${{ inputs.addon }}"-v*.mcaddon)
          test "$(echo "$file" | wc -l)" -eq 1
          tag=$(basename "$file" .mcaddon)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # `main` only accepts pull requests, so the version bump goes to a release branch.
      - name: Commit version bump
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release/${{ steps.build.outputs.tag }}"
          git add packs
          git commit -m "chore: release ${{ steps.build.outputs.tag }}"
          git push origin HEAD
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.build.outputs.tag }}" "${{ steps.build.outputs.file }}" \
            --target "${{ steps.bump.outputs.sha }}" \
            --title "${{ steps.build.outputs.tag }}" \
            --generate-notes

      # Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
      - name: Open version bump pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head "release/${{ steps.build.outputs.tag }}" \
            --title "chore: release ${{ steps.build.outputs.tag }}" \
            --body "Version bump for the ${{ steps.build.outputs.tag }} release. Merge it so the next release continues from this version."
