name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:json
      # The strict Creator Tools audit (`npm run validate`) reports known legacy
      # conventions, so it is not a gate. Packaging proves both add-ons still build.
      - run: npm run package
